<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="WARDRIVE">
  <style>
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00F0FF" opacity="0.03"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9D00FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="#000000"/>
  <rect width="1200" height="260" fill="url(#lines)"/>
  <rect x="16" y="16" width="1168" height="228" fill="none" stroke="#1E293B" stroke-width="2"/>
  <rect x="16" y="16" width="1168" height="3" fill="url(#glow)"/>
  <g class="mono">
    <text x="40" y="60" font-size="14" fill="#4A607A">NILL-OS // PROJECT</text>
    <text x="40" y="122" font-size="52" font-weight="700" fill="#00F0FF">&gt; WARDRIVE<tspan class="cursor">_</tspan></text>
    <text x="44" y="162" font-size="19" fill="#94A3B8">ESP32 wardriving rig + Android companion + Organic Maps / Android Auto overlay</text>
    <rect x="40" y="196" width="88" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="84.0" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">ESP32-S3</text><rect x="138" y="196" width="43" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="159.5" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">CYD</text><rect x="191" y="196" width="43" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="212.5" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">GPS</text><rect x="244" y="196" width="43" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="265.5" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">BLE</text><rect x="297" y="196" width="79" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="336.5" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">ANDROID</text><rect x="386" y="196" width="124" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="448.0" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">ANDROID AUTO</text><rect x="520" y="196" width="61" height="28" rx="4" fill="#080C10" stroke="#1E293B"/><text x="550.5" y="215" font-size="14" fill="#00F0FF" text-anchor="middle">WIGLE</text>
  </g>
</svg>
