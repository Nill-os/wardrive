; Car wardriving rig - three boards
;   wifi_node: promiscuous WiFi sniffer (ESP32-S3), owns the GPS module. No
;              SD card of its own - forwards its own WiFi observations, and
;              everything ble_node relays through it, to cyd_node over a
;              wired UART link.
;   ble_node:  BLE scanner (ESP32-S3) with no GPS or SD of its own - streams
;              each observation to wifi_node over a wired UART link.
;   cyd_node:  status display + storage/upload (CYD ESP32-2432S028 dual-USB).
;              Owns the only microSD card and config.cfg, runs the WigleWifi
;              CSV writer and the wdgwars.pl/WiGLE uploader, and is the rig's
;              only control surface (touchscreen). Links to the phone over BLE.
;
; Build one firmware per board:
;   pio run -e wifi_node -t upload
;   pio run -e ble_node  -t upload
;   pio run -e cyd_node  -t upload

[env]
; Pinned: espressif32 7.1.3 = Arduino-ESP32 core 2.0.17, what every board here is built and
; tested on. Unpinned, PlatformIO uses whatever espressif32 is newest on the machine, and a 3.x
; core (installed by another project) doesn't build this firmware (ledcSetup and friends are gone).
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
build_flags =
	-D CORE_DEBUG_LEVEL=1

[env:wifi_node]
; Multi-node channel split: to run more than one WiFi sniffer, flash each
; board with its own index, e.g. build_flags = ${env.build_flags} -D WARDRIVE_ROLE_WIFI
;   -D NODE_COUNT=3 -D NODE_INDEX=0   (then =1, =2 on the other two boards).
; Default (unset) = one node covering channels 1/6/11. See docs/DESIGN_NOTES.md.
board = esp32-s3-devkitc-1
build_src_filter = +<wifi_node/> -<ble_node/> -<cyd_node/>
lib_deps =
	mikalhart/TinyGPSPlus @ ^1.0.3
	h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
	${env.build_flags}
	-D WARDRIVE_ROLE_WIFI
	; This board has no separate USB-to-UART bridge chip - only the
	; ESP32-S3's native USB peripheral, which is also where ESP-IDF's own
	; console (boot messages, internal library logging) is wired by default.
	; Without these two flags, Arduino's Serial object maps to a plain
	; hardware UART on disconnected pins instead of that same native USB
	; port, so your own Serial.print() calls silently go nowhere while the
	; library's internal error logs (which use the console, not Serial)
	; still show up - looks exactly like a hang that isn't one.
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; The WiFi sniffer also runs on a Seeed Studio XIAO ESP32 - handy as a small,
; cheap extra sniffer node. Same wifi_node firmware, just a different board
; target; the desktop flasher's "WiFi board" picker selects one of these. Wire
; the GPS and the UART links to the same GPIO numbers as on the DevKitC (see
; docs/HARDWARE.md). The XIAO has no addressable RGB LED, so wardriveLedWrite()
; falls back to its single builtin LED. For the best range, prefer a XIAO
; variant with a u.FL/external-antenna connector (the external antenna is what
; gives the WiFi node its reach). Native USB, so the same two USB-console flags
; apply. The XIAO ESP32-C6 needs a newer Arduino-ESP32 core than the pinned
; platform ships, so it isn't offered yet.
[env:wifi_node_xiao_c3]
extends = env:wifi_node
board = seeed_xiao_esp32c3

[env:wifi_node_xiao_s3]
extends = env:wifi_node
board = seeed_xiao_esp32s3

[env:ble_node]
board = esp32-s3-devkitc-1
build_src_filter = +<ble_node/> -<wifi_node/> -<cyd_node/>
lib_deps =
	h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
	${env.build_flags}
	-D WARDRIVE_ROLE_BLE
	; Same native-USB-console reasoning as wifi_node - see its comment above.
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

; The BLE scanner also runs on a Seeed Studio XIAO ESP32 - a tiny, cheap board
; that's an easy drop-in for ble_node (BLE-only, no GPS/SD). Same ble_node
; firmware, just a different board target; the desktop flasher's "BLE board"
; picker selects one of these. The wired UART to wifi_node still uses GPIO3 (RX)
; and GPIO8 (TX) by pin number - wire to those GPIOs on the XIAO's silkscreen.
; The XIAO has no addressable RGB LED, so wardriveLedWrite() falls back to its
; single builtin LED (see ble_node/main.cpp). Native USB, so the same two
; USB-console flags apply.
[env:ble_node_xiao_c3]
extends = env:ble_node
board = seeed_xiao_esp32c3

[env:ble_node_xiao_s3]
extends = env:ble_node
board = seeed_xiao_esp32s3

; Note: the XIAO ESP32-C6 needs a newer Arduino-ESP32 core than the pinned
; espressif32 platform ships ("board doesn't support arduino framework"), so
; it's intentionally not offered yet. Bump the platform to add it.

; ESP32-2432S028 Dual USB "CYD2USB" - a plain ESP32 (not S3) with a real
; USB-to-UART bridge chip, so none of wifi_node/ble_node's native-USB flags
; apply here. Its USB-C port has no CC resistors - use USB-A-to-USB-C or the
; Micro-USB port to power/program it, a USB-C-to-USB-C cable won't work.
; Uses an ST7789 display driver, NOT the ILI9341 the classic single-USB CYD
; uses - don't copy ILI9341 config from other CYD projects for this board.
; TFT_eSPI is configured entirely via build_flags below (USER_SETUP_LOADED=1
; skips the library's own bundled User_Setup.h) rather than editing files
; inside the library, which would get clobbered on a `pio lib update`. Pin
; values are this exact dual-USB variant's pinout - verify against your own
; board's silkscreen/seller listing before flashing regardless, since
; sub-revisions can still differ.
[env:cyd_node]
; The installed espressif32 platform version doesn't have a dedicated
; "esp32-2432S028R" board definition yet - the CYD is a plain ESP32-WROOM-32
; module underneath, so the generic esp32dev board plus an explicit flash
; size (4MB on every CYD variant seen so far) is the standard community
; workaround used by every CYD PlatformIO project before that board ID
; existed upstream.
board = esp32dev
; default.csv's dual-app layout only gives the app ~1.25MB, which the NimBLE
; stack (added for the wifi_node link, see CydBleLink.h) leaves with under 30KB
; of headroom - too tight. min_spiffs.csv makes the app partition ~1.9MB by
; shrinking the unused SPIFFS partition, so the ~1.4MB app fits with ~0.5MB to
; spare. The CYD has no SPIFFS use anyway (config and logs live on the SD card),
; so nothing is lost by making that partition tiny.
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
build_src_filter = +<cyd_node/> -<wifi_node/> -<ble_node/>
lib_deps =
	bodmer/TFT_eSPI @ ^2.5.43
	h2zero/NimBLE-Arduino @ ^1.4.1
build_flags =
	${env.build_flags}
	-D WARDRIVE_ROLE_CYD
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	; The actual root cause of the "background renders as white/inverted"
	; bug (a plain runtime tft.invertDisplay() call was tried and removed
	; earlier, which did nothing - see below for why): TFT_eSPI's own
	; ST7789 init table (TFT_Drivers/ST7789_Init.h) unconditionally sends
	; the ST7789_INVON command during every tft.init() call, completely
	; independent of any application-level invertDisplay() call - it's
	; baked into the library's init sequence itself, not something a
	; runtime call can meaningfully override before the fact. This panel
	; doesn't need that inversion. TFT_INVERSION_OFF is the flag the
	; library itself checks for and, when defined, sends TFT_INVOFF right
	; after that same init table finishes (still inside tft.init()) -
	; the correct, supported way to cancel it, unlike trying to fight it
	; with a separate runtime call afterward.
	-D TFT_INVERSION_OFF=1
	; Declaring this panel's native orientation as landscape (swapping these
	; from the standard 240/320) was tried and reverted - it sent invalid
	; row/column address-window commands to this specific ST7789 variant,
	; corrupting its internal GRAM state (visible as shifted/repeated
	; content, worsening to full pixelation after a reset). Back to the
	; standard portrait-native declaration; landscape comes from
	; ROTATION_VALUE in main.cpp instead, which is TFT_eSPI's normal,
	; well-supported mechanism for this.
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	; No TFT_MISO - this panel is write-only (no readback), and the
	; dual-USB variant's own pin reference doesn't list one; leaving it
	; undefined avoids claiming a pin TFT_eSPI doesn't actually need.
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=-1
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D SPI_FREQUENCY=55000000
	-D SPI_READ_FREQUENCY=20000000
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
